{% extends "base.html" %}
{% block title %}Change PIN - {{ shop_name }}{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Change your PIN</h2>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

    <form method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="current_pin">Current PIN</label>
        <input type="password" id="current_pin" name="current_pin" inputmode="numeric" required autofocus>

        <label for="new_pin">New PIN</label>
        <input type="password" id="new_pin" name="new_pin" inputmode="numeric" required>

        <label for="confirm_pin">Type the new PIN again</label>
        <input type="password" id="confirm_pin" name="confirm_pin" inputmode="numeric" required>

        <button type="submit" class="btn-primary">Change PIN</button>
    </form>
</div>
{% endblock %}
