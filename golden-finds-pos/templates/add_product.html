{% extends "base.html" %}
{% block title %}Add Product - Golden Finds{% endblock %}

{% block content %}
<div class="form-card">
    <h2>New Product</h2>
    <p class="form-subtitle">This barcode isn't registered yet - add it once and it'll be remembered.</p>

    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/add-product">
        <label>Barcode</label>
        <input type="text" name="barcode" value="{{ barcode }}" required>

        <label>Product name</label>
        <input type="text" name="name" placeholder="e.g. Omo 1kg" required autofocus>

        <label>Category</label>
        <select name="category">
            <option value="Groceries & Food Items">Groceries & Food Items</option>
            <option value="Personal Care & Cosmetics">Personal Care & Cosmetics</option>
            <option value="Household Essentials">Household Essentials</option>
            <option value="Baby Care Products">Baby Care Products</option>
            <option value="Fashion & Accessories">Fashion & Accessories</option>
            <option value="Other">Other</option>
        </select>

        <label>Unit type</label>
        <select name="unit_type">
            <option value="piece">Piece</option>
            <option value="kg">Kg</option>
            <option value="litre">Litre</option>
            <option value="carton">Carton</option>
            <option value="bag">Bag</option>
        </select>

        <div class="form-row">
            <div>
                <label>Retail price (KSh)</label>
                <input type="number" step="0.01" name="retail_price" required>
            </div>
            <div>
                <label>Wholesale price (KSh)</label>
                <input type="number" step="0.01" name="wholesale_price" required>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Wholesale min. quantity</label>
                <input type="number" name="wholesale_min_qty" value="6">
            </div>
            <div>
                <label>Cost price (KSh)</label>
                <input type="number" step="0.01" name="cost_price" required>
            </div>
        </div>

        <label>Low stock alert threshold</label>
        <input type="number" name="low_stock_threshold" value="5">

        <label class="checkbox-label">
            <input type="checkbox" name="track_expiry">
            This product has an expiry date (food, drinks, dairy, etc.)
        </label>

        <button type="submit" class="btn-checkout">Save Product</button>
    </form>
</div>
{% endblock %}
