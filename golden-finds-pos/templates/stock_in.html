{% extends "base.html" %}
{% block title %}Stock in - {{ shop_name }}{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Stock in</h2>
    <p class="form-subtitle">Scan a product to record newly delivered stock.</p>

    <input type="text" id="scanner-input" autofocus autocomplete="off"
           value="{{ barcode }}" placeholder="Scan a barcode...">
    <div id="scan-message" class="scan-message" role="status" aria-live="polite"></div>

    <div id="stock-in-form" hidden>
        <p id="product-name" class="stock-in-product"></p>

        <label for="quantity">Quantity received</label>
        <input type="number" id="quantity" min="1" inputmode="numeric" required>

        <label for="cost-price">Cost price per unit (KSh)</label>
        <input type="number" id="cost-price" step="0.01" min="0" inputmode="decimal" required>
        <p class="field-hint" id="cost-hint"></p>

        <div id="expiry-field" hidden>
            <label for="expiry-date">Expiry date</label>
            <input type="date" id="expiry-date">
            <p class="field-hint">
                This becomes its own batch and will be sold before any
                later-expiring stock.
            </p>
        </div>

        <label for="batch-number">Batch or invoice number (optional)</label>
        <input type="text" id="batch-number" autocomplete="off">

        <button id="submit-stock-in" class="btn-primary">Add stock</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='stock_in.js') }}"></script>
{% endblock %}
