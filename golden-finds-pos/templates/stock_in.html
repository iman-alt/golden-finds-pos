{% extends "base.html" %}
{% block title %}Stock In - Golden Finds{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Stock In</h2>
    <p class="form-subtitle">Scan a product to add newly received stock.</p>

    <input type="text" id="scanner-input" autofocus placeholder="Scan barcode...">
    <div id="scan-message" class="scan-message"></div>

    <div id="stock-in-form" style="display:none; margin-top: 18px;">
        <p id="product-name" style="font-weight:600; font-size:18px; color:#d6336c;"></p>

        <label>Quantity received</label>
        <input type="number" id="quantity" min="1" required>

        <label>Cost price per unit (KSh)</label>
        <input type="number" id="cost-price" step="0.01" required>

        <div id="expiry-field" style="display:none;">
            <label>Expiry date</label>
            <input type="date" id="expiry-date">
        </div>

        <button id="submit-stock-in" class="btn-checkout">Add Stock</button>
    </div>
</div>

<script src="{{ url_for('static', filename='stock_in.js') }}"></script>
{% endblock %}
